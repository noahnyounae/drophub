name: drophub

services:
  app:
    build: .
    image: drophub:latest
    container_name: drophub-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # No port is published here: the app is reachable by the tunnel only.
    # Local access is added by docker-compose.local.yml (see COMPOSE_FILE in .env).

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: drophub-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
